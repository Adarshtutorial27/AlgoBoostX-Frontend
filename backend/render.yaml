services:
  - type: web
    name: algo-boost-x
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_NAME
        value: "Algo Boost X"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: USE_LIVE_TESTNET
        value: "false"
      - key: DELTA_BASE_URL
        value: https://cdn-ind.testnet.deltaex.org
      - key: DELTA_WS_URL
        value: wss://socket-ind.testnet.deltaex.org
      - key: DATABASE_URL
        value: sqlite:///./tokeniq.db
